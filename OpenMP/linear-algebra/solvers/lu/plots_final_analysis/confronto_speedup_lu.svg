<text x="550" y="51" text-anchor="middle" font-size="23" font-weight="bold" fill="#fff">Confronto degli speed-up LU</text>
<text x="550" y="99" text-anchor="middle" font-size="14" fill="#56617D">Misure perf · 4 thread richiesti · mediana delle ripetizioni</text>
