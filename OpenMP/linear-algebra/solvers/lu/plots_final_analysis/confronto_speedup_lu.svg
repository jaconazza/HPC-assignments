<polyline points="115,448.7894736842105 332.5,344.2469545957918 550,264.3956959480904 767.5,182.41245039889606 985,167.75150325461078" fill="none" stroke="#48A967" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="115" cy="448.7894736842105" r="6" fill="#48A967" stroke="#fff" stroke-width="2"><title>Versione a blocchi, MINI: 0.326316 (blocco 128)</title></circle>
