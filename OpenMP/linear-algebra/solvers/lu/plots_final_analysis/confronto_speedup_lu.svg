<rect x="185" y="568" width="730" height="46" rx="23" fill="#F6F7FB" stroke="#E2E5EF"/>
<line x1="215" y1="591" x2="249" y2="591" stroke="#16AFCB" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="232" cy="591" r="5" fill="#16AFCB" stroke="#fff" stroke-width="1.5"/>
<text x="259" y="596" font-size="13" font-weight="bold" fill="#303B5B">v2_simd</text>
<line x1="460" y1="591" x2="494" y2="591" stroke="#E94F85" stroke-width="3.5" stroke-linecap="round"/>
