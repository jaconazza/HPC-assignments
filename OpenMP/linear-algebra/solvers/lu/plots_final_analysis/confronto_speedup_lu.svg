<text x="749" y="596" font-size="13" font-weight="bold" fill="#303B5B">Versione a blocchi</text>
<text x="550" y="642" text-anchor="middle" font-size="12" fill="#68728A">Blocchi scelti sugli stessi dati mostrati; misure provenienti da due raccolte distinte.</text>
<text x="550" y="662" text-anchor="middle" font-size="12" fill="#68728A">Speed-up = mediana v0 / mediana versione; la linea tratteggiata indica 1×.</text>
