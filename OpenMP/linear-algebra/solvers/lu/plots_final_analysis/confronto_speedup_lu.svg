<text x="103" y="215" text-anchor="end" font-size="13" fill="#49546F">4×</text>
<line x1="115" y1="145" x2="985" y2="145" stroke="#DDE2EC" stroke-width="1"/>
<text x="103" y="150" text-anchor="end" font-size="13" fill="#49546F">5×</text>
<line x1="115" y1="405" x2="985" y2="405" stroke="#A34CCB" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M 115 145 V 470 H 985" fill="none" stroke="#35405F" stroke-width="1.5"/>
<text x="28" y="307.5" text-anchor="middle" font-size="14" fill="#35405F" transform="rotate(-90 28 307.5)">Speed-up rispetto a v0</text>
<text x="115" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#202B4C">MINI</text>
<text x="115" y="513" text-anchor="middle" font-size="12" fill="#49546F">N=32</text>
<text x="115" y="531" text-anchor="middle" font-size="12" fill="#68728A">blocco 128</text>
