<text x="103" y="410" text-anchor="end" font-size="13" fill="#49546F">1×</text>
<line x1="115" y1="340" x2="985" y2="340" stroke="#DDE2EC" stroke-width="1"/>
<text x="103" y="345" text-anchor="end" font-size="13" fill="#49546F">2×</text>
<line x1="115" y1="275" x2="985" y2="275" stroke="#DDE2EC" stroke-width="1"/>
